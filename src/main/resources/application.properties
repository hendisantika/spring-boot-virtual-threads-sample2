spring.application.name=spring-boot-thread-pool-vs-virtual-thread
server.port=8080
# Let 1,000 simultaneous connections queue at the socket instead of being refused
server.tomcat.accept-count=1000

# Spring Boot 3.2+: one line to switch Tomcat (and @Async, schedulers, ...) to virtual threads
spring.threads.virtual.enabled=true

# Simulated database latency (the "~1 s DB wait" from the diagram)
demo.db.latency=1s

management.endpoints.web.exposure.include=health,info,metrics
